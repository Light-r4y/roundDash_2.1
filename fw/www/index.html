<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>roundGauge</title>
    <link rel="stylesheet" href="/bootstrap.min.css">
    <link rel="stylesheet" href="/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <script defer src="/alpine.min.js"></script>
    <script src="/theme.js"></script>
    <script src="/i18n.js"></script>
    <script src="/auth-client.js"></script>
    <script src="/index.js"></script>
    <style>
        .tile { display: block; height: 100%; padding: 1rem; border-radius: .6rem; text-decoration: none;
                color: var(--rg-text); background: var(--rg-bg-elevated); border: 1px solid var(--rg-border);
                transition: border-color .15s, transform .15s; }
        .tile:hover { border-color: var(--rg-accent); color: var(--rg-text); transform: translateY(-2px); }
        .tile .tile-icon { font-size: 1.6rem; color: var(--rg-accent); }
        .tile .tile-title { font-weight: 600; margin-top: .4rem; }
        .tile .tile-sub { color: var(--rg-text-muted); font-size: .85rem; min-height: 1.2em; }
        .kv { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; border-top: 1px solid var(--rg-border); }
        .kv:first-child { border-top: 0; }
        .kv .k { color: var(--rg-text-muted); }
    </style>
</head>

<body>
    <div x-data="mainPage()" x-effect="document.title = t('title_main')">
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">
                    <i class="fas fa-gauge-high me-2"></i>roundGauge
                </span>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" :title="t('theme_toggle')"
                        @click="toggleTheme()">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="toggleLang()"
                        x-text="lang === 'ru' ? 'EN' : 'RU'"></button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" x-show="authRequired"
                        :title="authUnlocked ? t('auth_lock_tooltip') : t('auth_unlock_tooltip')"
                        @click="toggleLockButton()">
                        <i class="fas" :class="authUnlocked ? 'fa-lock-open' : 'fa-lock'"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Окно ввода пароля -->
        <div x-show="showUnlockModal" x-transition class="unlock-overlay" @click.self="showUnlockModal = false">
            <div class="unlock-modal">
                <h6 class="mb-3"><i class="fas fa-lock me-2"></i><span x-text="t('auth_unlock_title')"></span></h6>
                <input type="password" class="form-control form-control-sm mb-2" x-model="unlockPassword"
                    :class="unlockError ? 'is-invalid' : ''"
                    :placeholder="t('auth_unlock_password')" @input="unlockError = ''"
                    @keyup.enter="submitUnlock()">
                <div class="small text-fault mb-2" x-show="unlockError">
                    <i class="fas fa-triangle-exclamation me-1"></i><span x-text="unlockError"></span>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-accent" :disabled="unlockBusy || !unlockPassword"
                        @click="submitUnlock()">
                        <span x-text="unlockBusy ? t('checking') : t('auth_unlock_submit')"></span>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="showUnlockModal = false"
                        x-text="t('cancel')"></button>
                </div>
            </div>
        </div>

        <div class="container mt-4 mb-5" style="max-width:960px">
            <div class="alert py-2" :class="'alert-' + messageType" x-show="message" x-text="message"></div>

            <!-- Разделы -->
            <div class="row g-3 mb-3">
                <div class="col-6 col-md">
                    <a href="/editor.html" class="tile">
                        <i class="fas fa-sliders tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_editor')"></div>
                        <div class="tile-sub" x-text="subScreens()"></div>
                    </a>
                </div>
                <div class="col-6 col-md">
                    <a href="/media.html" class="tile">
                        <i class="fas fa-image tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_media')"></div>
                        <div class="tile-sub" x-text="subMedia()"></div>
                    </a>
                </div>
                <div class="col-6 col-md">
                    <a href="/can.html" class="tile">
                        <i class="fas fa-plug tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_can')"></div>
                        <div class="tile-sub" x-text="subCan()"></div>
                    </a>
                </div>
                <div class="col-6 col-md">
                    <a href="/imu.html" class="tile">
                        <i class="fas fa-compass tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_imu')"></div>
                        <div class="tile-sub" x-text="subImu()"></div>
                    </a>
                </div>
                <div class="col-6 col-md">
                    <a href="/access.html" class="tile">
                        <i class="fas fa-key tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_access')"></div>
                        <div class="tile-sub" x-text="authRequired ? t('tile_access_on') : t('tile_access_off')"></div>
                    </a>
                </div>
                <div class="col-6 col-md">
                    <a href="/ota" class="tile">
                        <i class="fas fa-cloud-upload-alt tile-icon"></i>
                        <div class="tile-title" x-text="t('nav_update')"></div>
                        <div class="tile-sub" x-text="status ? 'v' + status.fw_version : ''"></div>
                    </a>
                </div>
            </div>

            <div class="row g-3">
                <!-- Состояние -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="mb-3"><i class="fas fa-heart-pulse me-2"></i><span
                                    x-text="t('home_status')"></span></h6>
                            <div x-show="!status" class="small text-muted" x-text="t('home_no_link')"></div>
                            <template x-if="status">
                                <div>
                                    <div class="kv"><span class="k" x-text="t('st_version')"></span><span
                                            x-text="status.fw_version"></span></div>
                                    <div class="kv"><span class="k" x-text="t('st_uptime')"></span><span
                                            x-text="fmtUptime(status.uptime_s)"></span></div>
                                    <div class="kv"><span class="k" x-text="t('st_reset')"></span><span
                                            x-text="resetReason(status.reset_reason)"></span></div>
                                    <div class="kv"><span class="k" x-text="t('st_ap_clients')"></span><span
                                            x-text="status.ap_clients ?? 0"></span></div>
                                    <div class="kv" x-show="can"><span class="k" x-text="t('st_can')"></span><span>
                                            <span class="badge" :class="canClass()" x-text="canLabel()"></span>
                                            <span class="small text-muted ms-1" x-show="can && can.node_up"
                                                x-text="canRate + ' ' + t('can_fps')"></span></span></div>
                                    <div class="kv" x-show="status.heap"><span class="k" x-text="t('st_heap')"></span><span
                                            x-text="heapText()"></span></div>
                                    <div class="kv" x-show="media"><span class="k" x-text="t('st_media')"></span><span
                                            x-text="media ? fmtSize(media.used) + ' / ' + fmtSize(media.total) : ''"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Настройки -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h6 class="mb-3"><i class="fas fa-gear me-2"></i><span x-text="t('home_settings')"></span>
                            </h6>

                            <!-- Яркость -->
                            <label class="form-label small" for="bright" x-text="t('set_brightness')"></label>
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <i class="fas fa-sun text-muted"></i>
                                <input type="range" class="form-range" id="bright" min="5" max="100" step="1"
                                    :value="brightness" :disabled="controlsLocked() || brightness === null"
                                    @input="onBrightness($event)">
                                <span class="small text-muted text-nowrap" style="min-width:3em"
                                    x-text="brightness === null ? '-' : brightness + ' %'"></span>
                            </div>

                            <!-- Пароль и Wi-Fi - на отдельной странице -->
                            <a href="/access.html" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-key me-1"></i><span x-text="t('nav_access')"></span>
                                <span class="badge ms-1" :class="authRequired ? 'bg-success' : 'bg-secondary'"
                                    x-text="authRequired ? t('pw_on') : t('pw_off')"></span>
                            </a>
                            <div class="form-text mt-2" x-text="t('access_link_hint')"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
